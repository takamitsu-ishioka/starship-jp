<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin webmaster@bad-design.jp
    DocumentRoot /var/www/line.starship.jp
    ServerName line.starship.jp
    ErrorLog logs/line.starship.jp-error_log
    CustomLog logs/line.starship.jp-access_log common
    <Directory /var/www/line.starship.jp>
        Options FollowSymLinks
        AllowOverride All
    </Directory>
Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/www.starship.jp/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/www.starship.jp/privkey.pem
</VirtualHost>
</IfModule>
