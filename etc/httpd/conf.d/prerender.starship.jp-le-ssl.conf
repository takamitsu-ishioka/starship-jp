<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin kisaburo@starship.jp
    DocumentRoot /var/www/prerender-dev.starship.jp
    ServerName prerender-dev1.starship.jp
    ErrorLog logs/prerender-dev1.starship.jp-error_log
    CustomLog logs/prerender-dev1.starship.jp-access_log common
    <Directory /var/www/prerender-dev.starship.jp>
        Options FollowSymLinks
        AllowOverride All
    </Directory>
SSLCertificateFile /etc/letsencrypt/live/prerender-dev1.starship.jp/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/prerender-dev1.starship.jp/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
