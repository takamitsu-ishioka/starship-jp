<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin kisaburo@starship.jp
    DocumentRoot /var/www/www.starship.jp
    ServerName www.starship.jp
    ErrorLog logs/www.starship.jp-error_log
    CustomLog logs/www.starship.jp-access_log common
    <Directory /var/www/www.starship.jp>
        Options FollowSymLinks
        AllowOverride All
    </Directory>

    # ドキュメントルートディレクトリ
    <Directory /var/www/www.starship.jp>
        Options FollowSymLinks
        AllowOverride All
    </Directory>

    # バッチツール類とローカルサーバーのディレクトリは直接参照不可
    <Directory ~ /var/www/www.starship.jp/(config|batch|cgi-bin)>
        Order Deny,Allow
        Deny from All
        Allow from 121.1.142.207
        Allow from 127.0.0.1
        Allow from ::1
    </Directory>

    # 内部 API サーバーへの中継
    ProxyRequests Off
    ProxyPass /api/ http://priapi.starship.jp/
    ProxyPassReverse /api/ http://priapi.starship.jp/

    # ミリ波 Webhookアクセス用設定
    Alias /webhook/ /var/www/www.starship.jp/webhook/
    <Directory /var/www/www.starship.jp/webhook>
        Options +ExecCGI
        AddHandler cgi-script .cgi
        Require all granted
    </Directory>

    # 証明書
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/www.starship.jp-0001/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/www.starship.jp-0001/privkey.pem
</VirtualHost>
</IfModule>
