<script>

////////////////////////////////////////////////////////////////////////
// 関数

function GetHTML(uri, on_response) {
    $.ajax({
        type: 'GET',
        url: uri,
        dataType: 'html',
        cache: false,
        success: function(response, responseType) {
            if (responseType == 'success') {
                if (on_response._success) {
                    on_response._success(response, responseType);
                }
                if (on_response._finally) {
                    on_response._finally(true/*成功*/);
                }
            } else {
                if (on_response._error) {
                    on_response._error(response, responseType);
                }
                if (on_response._finally) {
                    on_response._finally(false/*失敗*/);
                }
            }
        },
        error: function(xhr, status, error) {
            if (on_response._fatal) {
                on_response._fatal(status, error + ': ' + uri);
            }
            if (on_response._finally) {
                on_response._finally(false/*失敗*/);
            }
        }
    });
}

function GetIncludeHTMLs(includes, body, include_uris, on_response) {
    var uri = include_uris.shift();
    //console.log('GetIncludeHTMLs(): uri>', uri);
    $.ajax({
        type: 'GET',
        url: uri,
        dataType: 'html',
        cache: false,
        success: function(html, responseType) {
            if (responseType == 'success') {
/*
                includes.push({
                    uri: uri,
                    html: html
                });
*/
                includes[uri] = html;
                if (0 < include_uris.length) {
                    GetIncludeHTMLs(includes, body, include_uris, on_response);
                    return;
                }
                if (on_response._success) {
                    on_response._success(body, includes);
                }
                if (on_response._finally) {
                    on_response._finally(true/*成功*/);
                }
            } else {
                if (on_response._error) {
                    on_response._error(response, responseType);
                }
                if (on_response._finally) {
                    on_response._finally(false/*失敗*/);
                }
            }
        },
        error: function(xhr, status, error) {
            if (on_response._fatal) {
                on_response._fatal(status, error + ': ' + uri);
            }
            if (on_response._finally) {
                on_response._finally(false/*失敗*/);
            }
        }
    });
}

function ReplaceBody(body, mincl, includes) {
    var replaced_body;
    if (mincl) {
        replaced_body = body.replace(/<!--[ \t]*__INCLUDE__[ \t]*.+\.(html|js)[ \t]*-->/g, function(str) {
            for (var i = 0; i < mincl.length; i++) {
                //console.log('str>', str);
                var m = mincl[i].match(/<!--[ \t]*__INCLUDE__[ \t]*(.+\.html|.+\.js)[ \t]*-->/);
                //console.log('m>', m);
                var include_uri = m[1];
                if (str.indexOf(include_uri) != -1) {
                    var html = includes[include_uri];
                    //console.log('str>', str);
                    //console.log('html>', html);
                    return html;
                }
            };
        });
    } else {
        replaced_body = body;
    }
    $('body').html(replaced_body);
    $('a[href$=".html"]').each(function(i, o) {
        var href = $(o).attr('href');             // prop('href') で取り出すとスキーマとホスト名の無い形式（てゆうか書いてある通り）の href が出てくる。
        let href_absolute = href.toAbsolutePath();
        var href_js = 'javascript:LoadBody("' + href_absolute + '");';
        $(o).attr('href', href_js);
    });
}

function LoadBody(uri) {

    if (typeof ShowLoading == 'function') {
        ShowLoading();
    }

    ////////////////////////////////////////////////////////////////////////
    // index ページ（つまり、このページ）が要求されていればデフォルトページを表示する。

    if (uri == undefined || uri == '' || uri == '/' || uri == './' || uri == 'index.html' || uri == '/index.html' || uri == './index.html') {
        uri = User.getCurrent().getIndexPath();
    }

    ////////////////////////////////////////////////////////////////////////
    // 指定されたページのデータを取得し、body 部を置換する。

    // TODO: ここから
    let language = Location.getCurrent().getQueryValueOf('lang');
    if (language == undefined) {
        language = Preferences.get('language', true);
        //Console.debug(language, '>>>>>>> LoadBody::Preference:');
    }
    if (language == undefined) {
        language = User.getCurrent().getLanguage();
    }
    // TODO: ここまでを、User.getCurrent().getCurrentLanguage() に変更する。
    let redirected_to_uri = WebSite.map(uri, User.getCurrent().account, language);
    Console.debug(uri, '>>>>>>> uri:');
    Console.debug(language, '>>>>>>> language:');
    Console.debug(redirected_to_uri, '>>>>>>> redirected_to_uri:');

    User.getCurrent().pushURI(uri);

    //GetHTML(uri, {
    GetHTML(redirected_to_uri, {
        _success: function(response, responseType) {
            var mbody = response.match(/<body>([\.\s\S]*)<\/body>/i);   // . は改行にマッチしない。\s はアスキーの、\S はユニコードの改行にマッチする。
            if (mbody == undefined) {
                alert('body not found in ' + uri);
                return;
            }
            var include_uris = [];
            var body = mbody[1];
            var mincl = body.match(/<!--[ \t]*__INCLUDE__[ \t]*.+\.(html|js)[ \t]*-->/g);
            if (mincl) {
                for (var i = 0; i < mincl.length; i++) {
                    console.log('mincl[' + i + ']>', mincl[i]);
                    var m = mincl[i].match(/<!--[ \t]*__INCLUDE__[ \t]*(.+\.html|.+\.js)[ \t]*-->/);
                    var include_uri = m[1];
                    console.log('include_uri>', include_uri);
                    include_uris.push(include_uri);
                };
                //console.log('include_uris>', include_uris);
                GetIncludeHTMLs([], body, include_uris, {
                    _success: function(body, includes) {
                        //console.log('includes>', includes);
                        ReplaceBody(body, mincl, includes);
                    },
                    _error: function(response, responseType) {
                        console.log('GetHTML::GetIncludeHTMLs(): _error: response>', response, ', responseType>', responseType);
                    },
                    _fatal: function(status, error) {
                        console.log('GetHTML::GetIncludeHTMLs(): _fatal: status>', status, ', error>', error);
                    },
                    _finally: function(success) {
                        //console.log('GetHTML::GetIncludeHTMLs(): _finally: success>', success);
                    }
                });
            } else {
                ReplaceBody(body);
            }
        },
        _error: function(response, responseType) {
            console.log('GetHTML(): _error: response>', response, ', responseType>', responseType);
        },
        _fatal: function(status, error) {
            console.log('GetHTML(): _fatal: status>', status, ', error>', error);
        },
        _finally: function(success) {
            console.log('GetHTML():  _finally: uri==' + uri + ', success==' + success);
        }
    });
}

////////////////////////////////////////////////////////////////////////
// 最初のページを表示する
/*
このウェブアプリは一切ページ遷移をしない。
ユーザーから指定されたページのデータを $.ajax() で取得し、その body 部をカレントページの DOM の body 部に挿入することで表示内容のみを変更する。
従って、「プロセス」（状態遷移を行うための状態のデータと手続きのデータ）は、すべて常にローカルメモリ上に存在することになり、画面の変化とは全く関係が無くなった。
「プロセス」がカレントプロセスと一致するという、昔からあるスタンドアロンプログラムの状態に戻った。
これまでのウェブアプリでリモートホスト上に「プロセス」を擬似的に実現するために施されていた諸々の工夫（疑似セッション、クッキー、LB 制御など）は不要になり、リモートホストは単なるデータの置き場となった。
*/

$(document).ready(function(e) {

    // href を解析し、クエリーがあれば読み取る。
    try {
        Location.setCurrent(location);
    } catch (e) {
        var e_str = JSON.stringify(e, null, '    ');
        alert("can't parse location.href: e: " + e_str);
        return;
    }

    // サイトの初期化。
    InitializeSite();

    // ユーザーの初期化（最初は常に guest）。
    User.initialize();

    LoadBody();
});

</script>
