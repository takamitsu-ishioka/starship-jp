
########################################################################
# starship.jp ブランド（＝ポートフォリオ＝ショーケース）サイト開発環境
########################################################################

################
# 1 番機
<VirtualHost *:80>

    ServerAdmin ishioka@starship.jp
    DocumentRoot /var/www/www-dev.starship.jp
    ServerName www-dev1.starship.jp
    ErrorLog logs/www-dev1.starship.jp-error_log
    CustomLog logs/www-dev1.starship.jp-access_log common

    # ドキュメントルートディレクトリ
    <Directory /var/www/www-dev.starship.jp>
        Options FollowSymLinks
        AllowOverride All
    </Directory>

    # バッチツール類とローカルサーバーのディレクトリは直接参照不可
    <Directory ~ /var/www/www-dev.starship.jp/(config|batch|cgi-bin)>
        Order Deny,Allow
        Deny from All
        Allow from 121.1.142.207
        Allow from 127.0.0.1
        Allow from ::1
    </Directory>

    # 内部 API サーバーへの中継
    ProxyRequests Off
    ProxyPass /api/ http://priapi-dev1.starship.jp/
    ProxyPassReverse /api/ http://priapi-dev1.starship.jp/

</VirtualHost>

