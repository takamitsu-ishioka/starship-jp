<!-- ジェネリック・ダイアログ -->
<!--
これはコピーして使うファイル。
使い方。
・適当な名前（仮に foobar.html とする）でコピーする。
・foobar.html に対して以下の変更を加える。
・文字列 "generic_dialog" を "foobar_dialog" に置換する。
・文字列 "GenericDialog" を "FoobarDialog" に置換する。
・不必要なコントロール（GUI 部品）を削除する。
・必要なコントロールを追加する。
・文字列やアイコンを適当なものに変える。
・削除したコントロールを実装している <script src="..."></script> を削除する。
・追加したコントロールを実装している <script src="..."></script> を追加する。
・必要なら .command-cancel の click ハンドラーを書く。
・.command-ok の click ハンドラーを書く。
・foobar_dialog を使いたいページの html の \<!-- END PLUGINS --\> より後ろの適当な位置に \<!-- __INCLUDE__ /js/includes/foobar.html --\> を挿入する。
・そのページの <script>...</script> または適当な js の中に ShowFoobarDialog() を実行するコードを書く。
-->
<style type="text/css">
body.modal-open {
    height: 100vh;
    overflow-y: hidden;
}
</style>
<div class="modal fade generic_dialog" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close command-cancel" data-dismiss="modal"><span aria-hidden="true">&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title">Login</h4>
            </div>
            <div class="modal-body">
                <div class="form-group row">
                    <label class="col-md-3 col-xs-12 control-label">Text Field</label>
                    <div class="col-md-9 col-xs-12">
                        <div class="input-group">
                            <span class="input-group-addon"><span class="fa fa-pencil"></span></span>
                            <input type="text" class="form-control"/>
                        </div>
                        <span class="help-block">This is sample of text field</span>
                    </div>
                </div>

                <div class="form-group row">
                    <label class="col-md-3 col-xs-12 control-label">Password</label>
                    <div class="col-md-9 col-xs-12">
                        <div class="input-group">
                            <span class="input-group-addon"><span class="fa fa-unlock-alt"></span></span>
                            <input type="password" class="form-control"/>
                        </div>
                        <span class="help-block">Password field sample</span>
                    </div>
                </div>

                <div class="form-group row">
                    <label class="col-md-3 col-xs-12 control-label">Datepicker</label>
                    <div class="col-md-9 col-xs-12">
                        <div class="input-group">
                            <span class="input-group-addon"><span class="fa fa-calendar"></span></span>
                            <input type="text" class="form-control datepicker" value="2014-11-01">
                        </div>
                        <span class="help-block">Click on input field to get datepicker</span>
                    </div>
                </div>

                <div class="form-group row">
                    <label class="col-md-3 col-xs-12 control-label">Textarea</label>
                    <div class="col-md-9 col-xs-12">
                        <textarea class="form-control" rows="5"></textarea>
                        <span class="help-block">Default textarea field</span>
                    </div>
                </div>

                <div class="form-group row">
                    <label class="col-md-3 col-xs-12 control-label">Tags</label>
                    <div class="col-md-9 col-xs-12">
                        <input type="text" class="tagsinput" value="First,Second,Third"/>
                        <span class="help-block">Default textarea field</span>
                    </div>
                </div>

                <div class="form-group row">
                    <label class="col-md-3 col-xs-12 control-label">Select</label>
                    <div class="col-md-9 col-xs-12">
                        <select class="form-control select">
                            <option value="1">Option 1</option>
                            <option value="2">Option 2</option>
                            <option value="3">Option 3</option>
                            <option value="4">Option 4</option>
                            <option value="5">Option 5</option>
                        </select>
                        <span class="help-block">Select box example</span>
                    </div>
                </div>

                <div class="form-group row">
                    <label class="col-md-3 col-xs-12 control-label">File</label>
                    <div class="col-md-9 col-xs-12">
                        <input type="file" class="fileinput btn-primary" name="filename" id="filename" title="Browse file"/>
                        <span class="help-block">Input type file</span>
                    </div>
                </div>

                <div class="form-group row">
                    <label class="col-md-3 col-xs-12 control-label">Checkbox</label>
                    <div class="col-md-9 col-xs-12">
                        <label class="check"><input type="checkbox" class="icheckbox" checked="checked"/> Checkbox title</label>
                        <span class="help-block">Checkbox sample, easy to use</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default pull-left command-cancel" data-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary command-ok" data-dismiss="modal">OK</button>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript" src="/js/plugins/bootstrap/bootstrap-datepicker.js"></script>
<script type="text/javascript" src="/js/plugins/bootstrap/bootstrap-file-input.js"></script>
<script type="text/javascript" src="/js/plugins/bootstrap/bootstrap-select.js"></script>
<script type="text/javascript" src="/js/plugins/tagsinput/jquery.tagsinput.min.js"></script>
<script>
$('.generic_dialog .command-cancel').click(function(e) {
    // 何かするか何もしない。
});
$('.generic_dialog .command-ok').click(function(e) {
    GenericDialogOnOK($('.generic_dialog'));
});
function GenericDialogOnOK(dialog) {
    // 何かする。
}
function ShowGenericDialog() {
    var dialog = $('.generic_dialog');
    dialog.modal({
        show: true,
        keyboard: true,
        backdrop: 'static',
    });
}
</script>
<!-- END ジェネリック・ダイアログ -->
